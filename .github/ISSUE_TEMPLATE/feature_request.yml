name: Feature request
description: Suggest a new tool, builder option or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, e.g. "As a GM, I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
