name: Bug report
description: Something on daggerheartbrews.com or in a local build isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first to avoid duplicates.
        For security problems, do not open a public issue; see the security link on the new issue page instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - daggerheartbrews.com
        - Local development
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS (plus Node version for local development)
      placeholder: Firefox 131, macOS 15
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag images in, or paste console output.
